<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Plano del cole</title>
  <meta name="description" content="Plano editable del centro: muros, puertas, espacios, anotaciones, red y cableado, foto aérea y 3D.">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Plano">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="iconos/icono-180.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body class="modo-ver">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>

      <symbol id="i-ventana" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="6" rx=".5"/><path d="M3 12h18"/></symbol>
      <symbol id="i-paso" viewBox="0 0 24 24"><path d="M2 9h6v6H2M22 9h-6v6h6"/><path d="M8 9h8M8 15h8" stroke-dasharray="2 2"/></symbol>
      <symbol id="i-espacio" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 11h8M9.5 14h5"/></symbol>
      <symbol id="i-pilar" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1"/><path d="M7 7l10 10M17 7L7 17"/></symbol>
      <symbol id="i-nota" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><path d="M12 6.5v4.5M12 13.6v.1"/></symbol>
      <symbol id="i-medir" viewBox="0 0 24 24"><path d="M3.5 16.5l13-13 4 4-13 13z"/><path d="M7 13l2 2M10 10l1.6 1.6M13 7l2 2"/></symbol>
      <symbol id="i-deshacer" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
      <symbol id="i-rehacer" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></symbol>
      <symbol id="i-buscar" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></symbol>
      <symbol id="i-encuadrar" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
      <symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-menos" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-archivo" viewBox="0 0 24 24"><path d="M3 7.5V18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9.5a2 2 0 0 0-2-2h-7L10 5H5a2 2 0 0 0-2 2.5z"/></symbol>
      <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>
      <symbol id="i-cerrar" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-papelera" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></symbol>
      <symbol id="i-logo" viewBox="0 0 24 24"><path d="M3 21V9l9-6 9 6v12z"/><path d="M3 13h7v8M10 13h11"/></symbol>
      <symbol id="i-ojo" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-editar" viewBox="0 0 24 24"><path d="M3 21h6M4.5 15.5L15 5l4 4-10.5 10.5H4.5z"/><path d="M13 7l4 4"/></symbol>
      <symbol id="i-boli" viewBox="0 0 24 24"><path d="M15.5 4.5l4 4L9 19l-5 1 1-5z"/><path d="M13.5 6.5l4 4"/><path d="M3 22c2.5-1 4-1 6 0s4 1 6 0" stroke-dasharray="0"/></symbol>
      <symbol id="i-cubo" viewBox="0 0 24 24"><path d="M12 2.8l8.5 4.7v9L12 21.2l-8.5-4.7v-9z"/><path d="M3.5 7.5L12 12l8.5-4.5M12 12v9.2"/></symbol>
      <symbol id="i-capas" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5M3 16.5l9 5 9-5"/></symbol>
      <symbol id="i-rotulador" viewBox="0 0 24 24"><path d="M14 4l6 6-7.5 7.5H8.5L6.5 15.5z"/><path d="M6.5 15.5L4 21l5.5-2.5"/><path d="M10 9.5l4.5 4.5"/></symbol>
      <symbol id="i-lapiz" viewBox="0 0 24 24"><path d="M16.5 3.5l4 4L8 20l-5 1 1-5z"/><path d="M4 16l4 4"/></symbol>
      <symbol id="i-borrador" viewBox="0 0 24 24"><path d="M8.5 20.5h12"/><path d="M5.5 15.5L14 7l5 5-8.5 8.5H8z"/><path d="M10 11l5 5"/></symbol>
      <symbol id="i-texto" viewBox="0 0 24 24"><path d="M5 6V4.5h14V6M12 4.5v15M9 19.5h6"/></symbol>
      <symbol id="i-flecha" viewBox="0 0 24 24"><path d="M4.5 19.5l15-15M10 4.5h9.5V14"/></symbol>
      <symbol id="i-mano" viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11.5V4a1.5 1.5 0 0 1 3 0v8M14 11.5V5.5a1.5 1.5 0 0 1 3 0v8M17 9.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.8-2.4L4.5 14.5a1.6 1.6 0 0 1 2.4-2L8 13.5"/></symbol>
      <symbol id="i-satelite" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 15l5-4 4 3 3-2 6 5"/><circle cx="15.5" cy="8" r="1.6"/></symbol>
      <symbol id="i-girar" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/></symbol>
      <symbol id="i-camara" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
      <symbol id="i-arriba" viewBox="0 0 24 24"><path d="M12 5v14M6 11l6-6 6 6"/></symbol>
      <symbol id="i-abajo" viewBox="0 0 24 24"><path d="M12 19V5M6 13l6 6 6-6"/></symbol>
      <symbol id="i-izq" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
      <symbol id="i-dcha" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-red" viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="5" rx="1"/><rect x="2.5" y="16.5" width="6" height="5" rx="1"/><rect x="15.5" y="16.5" width="6" height="5" rx="1"/><path d="M12 7.5V12M5.5 16.5V12h13v4.5"/></symbol>
      <symbol id="i-cable" viewBox="0 0 24 24"><path d="M5 15c0-6 4-9 7-9s7 3 7 9"/><rect x="2.5" y="15" width="5" height="6" rx="1"/><rect x="16.5" y="15" width="5" height="6" rx="1"/></symbol>
      <symbol id="i-armario" viewBox="0 0 24 24"><rect x="5.5" y="2.5" width="13" height="19" rx="1.5"/><path d="M5.5 7.5h13M5.5 12h13M5.5 16.5h13M8.5 5h.01M8.5 9.7h.01M8.5 14.3h.01"/></symbol>
      <symbol id="i-switch" viewBox="0 0 24 24"><rect x="2.5" y="8" width="19" height="8" rx="1.5"/><path d="M6.5 12h.01M9.5 12h.01M12.5 12h.01M15.5 12h.01M18.5 12h.01"/></symbol>
      <symbol id="i-router" viewBox="0 0 24 24"><rect x="3" y="12.5" width="18" height="7" rx="1.5"/><path d="M7 16h.01M10.5 16h.01M8.5 12.5L6.5 5M15.5 12.5l2-7.5"/></symbol>
      <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2.5 9.5a14 14 0 0 1 19 0M5.5 12.8a9.6 9.6 0 0 1 13 0M8.6 16a5 5 0 0 1 6.8 0M12 19.3h.01"/></symbol>
      <symbol id="i-toma" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M8 9h8v4.5h-2v2h-4v-2H8z"/></symbol>

    </defs>
  </svg>

  <header class="barra">
    <div class="marca">
      <svg class="ic logo"><use href="#i-logo"/></svg>
      <div class="marca-txt">
        <div class="marca-t">Plano del cole</div>
        <div class="marca-s" id="nombre-centro">—</div>
      </div>
    </div>
    <select id="sel-edificio" class="sel-edificio" aria-label="Edificio"></select>
    <nav class="modos" id="modos" aria-label="Modo">
      <button data-modo="ver" title="Consultar el plano sin tocar nada"><svg class="ic"><use href="#i-ojo"/></svg><span>Ver</span></button>
      <button data-modo="editar" title="Mover paredes, puertas, salas…"><svg class="ic"><use href="#i-editar"/></svg><span>Editar</span></button>
      <button data-modo="anotar" title="Dibujar y escribir encima, como en un papel"><svg class="ic"><use href="#i-boli"/></svg><span>Anotar</span></button>
      <button data-modo="red" title="Red: switches, puntos WiFi, tomas y el recorrido de los cables"><svg class="ic"><use href="#i-red"/></svg><span>Red</span></button>
      <button data-modo="3d" title="Ver el cole en 3D"><svg class="ic"><use href="#i-cubo"/></svg><span>3D</span></button>
    </nav>
    <div class="buscador">
      <svg class="ic"><use href="#i-buscar"/></svg>
      <input id="buscar" type="search" placeholder="Buscar sala, grupo o equipo…" autocomplete="off" spellcheck="false">
      <div class="resultados" id="resultados" hidden></div>
    </div>
    <div class="acciones">
      <button class="btn-ic" id="b-deshacer" title="Deshacer (Ctrl+Z)"><svg class="ic"><use href="#i-deshacer"/></svg></button>
      <button class="btn-ic" id="b-rehacer" title="Rehacer (Ctrl+Y)"><svg class="ic"><use href="#i-rehacer"/></svg></button>
      <div class="menu-cont">
        <button class="btn-ic" id="b-archivo" title="Archivo"><svg class="ic"><use href="#i-archivo"/></svg><i class="punto-sucio" title="Hay cambios sin guardar en archivo"></i></button>
        <div class="menu" id="menu-archivo" hidden>
          <button data-acc="abrir">Abrir plano…<kbd>Ctrl+O</kbd></button>
          <button data-acc="guardar">Guardar<kbd>Ctrl+S</kbd></button>
          <button data-acc="guardar-como">Guardar como…<kbd>Ctrl+Mayús+S</kbd></button>
          <hr>
          <button data-acc="svg">Exportar planta en SVG</button>
          <button data-acc="png">Exportar planta en PNG</button>
          <button data-acc="png3d">Exportar vista 3D en PNG</button>
          <button data-acc="imprimir">Imprimir / PDF…</button>
          <hr>
          <button data-acc="nuevo">Plano nuevo vacío</button>
        </div>
      </div>
      <button class="btn-ic" id="b-panel" title="Mostrar u ocultar el panel"><svg class="ic"><use href="#i-panel"/></svg></button>
    </div>
  </header>

  <main class="cuerpo">
    <aside class="herramientas" id="herramientas" aria-label="Herramientas">
      <div class="herr-editar">
        <button data-herr="sel" title="Seleccionar y mover (V)"><svg class="ic"><use href="#i-sel"/></svg><span>Mover</span></button>
        <span class="grupo-h">Dibujar</span>
        <button data-herr="muro" title="Dibujar muros (M)"><svg class="ic"><use href="#i-muro"/></svg><span>Muro</span></button>
        <button data-herr="puerta" title="Puerta (P)"><svg class="ic"><use href="#i-puerta"/></svg><span>Puerta</span></button>
        <button data-herr="ventana" title="Ventana (W)"><svg class="ic"><use href="#i-ventana"/></svg><span>Ventana</span></button>
        <button data-herr="paso" title="Paso sin puerta (H)"><svg class="ic"><use href="#i-paso"/></svg><span>Paso</span></button>
        <button data-herr="pilar" title="Pilar (C)"><svg class="ic"><use href="#i-pilar"/></svg><span>Pilar</span></button>
        <span class="grupo-h">Datos</span>
        <button data-herr="espacio" title="Nombrar un espacio (E)"><svg class="ic"><use href="#i-espacio"/></svg><span>Sala</span></button>
        <button data-herr="nota" title="Nota (N)"><svg class="ic"><use href="#i-nota"/></svg><span>Nota</span></button>
        <button data-herr="medir" title="Medir distancias (D)"><svg class="ic"><use href="#i-medir"/></svg><span>Medir</span></button>
      </div>
      <div class="herr-red">
        <button data-herr="sel" title="Seleccionar y mover (V)"><svg class="ic"><use href="#i-sel"/></svg><span>Mover</span></button>
        <button data-herr="cable" title="Tender un cable (C)"><svg class="ic"><use href="#i-cable"/></svg><span>Cable</span></button>
        <span class="grupo-h">Equipos</span>
        <button data-herr="armario" title="Armario o rack (A)"><svg class="ic"><use href="#i-armario"/></svg><span>Armario</span></button>
        <button data-herr="router" title="Router (R)"><svg class="ic"><use href="#i-router"/></svg><span>Router</span></button>
        <button data-herr="switch" title="Switch (S)"><svg class="ic"><use href="#i-switch"/></svg><span>Switch</span></button>
        <button data-herr="ap" title="Punto de acceso WiFi (W)"><svg class="ic"><use href="#i-wifi"/></svg><span>WiFi</span></button>
        <button data-herr="toma" title="Toma de red (T)"><svg class="ic"><use href="#i-toma"/></svg><span>Toma</span></button>
        <button data-herr="equipo" title="Ordenador, impresora, proyector… (E)"><svg class="ic"><use href="#i-pc"/></svg><span>Equipo</span></button>
      </div>
    </aside>

    <section class="lienzo" id="lienzo">
      <div class="opciones" id="opciones" hidden></div>
      <svg id="plano" class="plano" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="rayado" patternUnits="userSpaceOnUse" width="0.18" height="0.18" patternTransform="rotate(45)">
            <rect width="0.18" height="0.18" fill="#fde3c4"/>
            <rect width="0.07" height="0.18" fill="#e07b16"/>
          </pattern>
        </defs>
        <g id="g-rejilla"></g>
        <g id="mundo">
          <g id="g-satelite"></g>
          <g id="g-calco"></g>
          <g id="g-contexto"></g>
          <g id="g-modelo"></g>
          <g id="g-hover"></g>
          <g id="g-red"></g>
          <g id="g-anot"></g>
          <g id="g-sel"></g>
        </g>
        <g id="g-sobre"></g>
        <g id="g-red-sobre"></g>
      </svg>
      <div class="vista3d" id="vista3d" hidden>
        <div class="barra-3d" id="barra-3d"></div>
        <div class="cargando-3d" id="cargando-3d">Construyendo el 3D…</div>
      </div>

      <div class="flot-capas">
        <button class="btn-flot" id="b-capas" title="Capas: foto aérea, calco, anotaciones…"><svg class="ic"><use href="#i-capas"/></svg><span>Capas</span></button>
        <div class="popover" id="pop-capas" hidden></div>
      </div>
      <div class="pisos" id="pisos" aria-label="Plantas"></div>
      <div class="zoom">
        <button class="btn-ic" id="b-zoom-mas" title="Acercar (+)"><svg class="ic"><use href="#i-mas"/></svg></button>
        <button class="btn-ic" id="b-zoom-menos" title="Alejar (−)"><svg class="ic"><use href="#i-menos"/></svg></button>
        <button class="btn-ic" id="b-encuadrar" title="Ver toda la planta (F)"><svg class="ic"><use href="#i-encuadrar"/></svg></button>
        <button class="btn-ic" id="b-medir" title="Medir (D)"><svg class="ic"><use href="#i-medir"/></svg></button>
      </div>
      <div class="barra-contexto" id="barra-contexto" hidden></div>
      <div class="paleta" id="paleta" hidden></div>
      <div class="ajuste-sat" id="ajuste-sat" hidden></div>
      <div class="atribucion" id="atribucion" hidden></div>
      <div class="estado">
        <span id="est-cursor"></span>
        <span id="est-msg"></span>
        <span id="est-pista"></span>
        <span id="est-guardado"></span>
      </div>
      <div class="bienvenida" id="bienvenida" hidden>
        <div class="tarjeta">
          <svg class="ic grande"><use href="#i-logo"/></svg>
          <h1>Plano del cole</h1>
          <p>Abre el archivo del plano (<code>.plano.json</code>) para empezar. La primera vez, es el que se genera a partir del Plan de Autoprotección.</p>
          <div class="fila">
            <button class="btn primario" data-acc="abrir">Abrir plano…</button>
            <button class="btn" data-acc="nuevo">Empezar uno vacío</button>
          </div>
          <p class="nota-priv">El plano no sale de este dispositivo: se guarda en el navegador y en el archivo que tú elijas.</p>
        </div>
      </div>
    </section>

    <aside class="panel" id="panel">
      <div class="pestanas" role="tablist">
        <button role="tab" data-pest="props" class="activa">Detalles</button>
        <button role="tab" data-pest="esquema">Esquema</button>
        <button role="tab" data-pest="versiones">Versiones</button>
        <button class="btn-ic cerrar-hoja" id="b-cerrar-panel" title="Cerrar el panel"><svg class="ic"><use href="#i-cerrar"/></svg></button>
      </div>
      <div class="pest-cont" id="pest-props"></div>
      <div class="pest-cont" id="pest-esquema" hidden></div>
      <div class="pest-cont" id="pest-versiones" hidden></div>
    </aside>
  </main>

  <div class="avisos" id="avisos" aria-live="polite"></div>
  <div id="impresion" class="impresion" aria-hidden="true"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
